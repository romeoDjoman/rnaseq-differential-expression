    <circle cx="195" cy="180" r="3.5"/><circle cx="175" cy="155" r="4"/><circle cx="215" cy="165" r="3.5"/>
    <circle cx="155" cy="140" r="4"/><circle cx="235" cy="200" r="3"/><circle cx="165" cy="175" r="3.5"/>
    <circle cx="185" cy="210" r="3"/><circle cx="145" cy="195" r="3.5"/><circle cx="225" cy="185" r="3"/>
    <circle cx="200" cy="230" r="3"/><circle cx="170" cy="220" r="3.5"/><circle cx="240" cy="155" r="3"/>
    <circle cx="130" cy="162" r="4"/><circle cx="250" cy="178" r="3"/><circle cx="120" cy="185" r="3.5"/>
    <circle cx="140" cy="218" r="3"/><circle cx="255" cy="210" r="2.5"/><circle cx="110" cy="205" r="3.5"/>
    <circle cx="260" cy="240" r="2.5"/><circle cx="125" cy="240" r="3"/>
  </g>

  <!-- UP points (red, right side, above threshold) -->
  <g fill="#C62828" opacity="0.75">
    <circle cx="705" cy="175" r="3.5"/><circle cx="725" cy="150" r="4"/><circle cx="685" cy="160" r="3.5"/>
    <circle cx="745" cy="135" r="4.5"/><circle cx="665" cy="195" r="3"/><circle cx="735" cy="170" r="3.5"/>
    <circle cx="715" cy="205" r="3"/><circle cx="755" cy="190" r="3.5"/><circle cx="675" cy="180" r="3"/>
    <circle cx="700" cy="225" r="3"/><circle cx="730" cy="215" r="3.5"/><circle cx="760" cy="155" r="3"/>
    <circle cx="770" cy="170" r="4"/><circle cx="650" cy="175" r="3"/><circle cx="780" cy="185" r="3.5"/>
    <circle cx="760" cy="210" r="3"/><circle cx="790" cy="160" r="3.5"/><circle cx="640" cy="190" r="3"/>
    <circle cx="800" cy="195" r="3"/><circle cx="630" cy="205" r="3"/><circle cx="810" cy="175" r="3.5"/>
    <circle cx="820" cy="145" r="4"/><circle cx="825" cy="168" r="3"/><circle cx="815" cy="200" r="2.5"/>
  </g>

  <!-- Gene labels for key DEGs -->
  <g font-size="9" font-style="italic">
    <text x="748" y="130" fill="#B71C1C" font-weight="bold">BRCA1</text>
    <text x="725" y="148" fill="#B71C1C">EGFR</text>
    <text x="710" y="168" fill="#B71C1C">HIF1A</text>
    <text x="822" y="140" fill="#B71C1C">VEGFA</text>
    <text x="130" y="135" fill="#0D47A1" font-weight="bold">TP53</text>
    <text x="110" y="180" fill="#0D47A1">KRAS</text>
    <text x="148" y="213" fill="#0D47A1">RB1</text>
    <text x="100" y="200" fill="#0D47A1">MYC</text>
  </g>

  <!-- Count labels -->
  <text x="720" y="620" text-anchor="middle" font-size="11" fill="#C62828" font-weight="bold">n Up = 642</text>
  <text x="200" y="620" text-anchor="middle" font-size="11" fill="#1565C0" font-weight="bold">n Down = 419</text>

  <!-- Axes -->
  <line x1="80" y1="620" x2="840" y2="620" stroke="#424242" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="620" stroke="#424242" stroke-width="1.5"/>

  <!-- X axis ticks and labels -->
  <g font-size="10" fill="#424242" text-anchor="middle">
    <line x1="180" y1="618" x2="180" y2="624" stroke="#424242"/><text x="180" y="636">-4</text>
    <line x1="310" y1="618" x2="310" y2="624" stroke="#424242"/><text x="310" y="636">-1</text>
    <line x1="460" y1="618" x2="460" y2="624" stroke="#424242"/><text x="460" y="636">0</text>
    <line x1="610" y1="618" x2="610" y2="624" stroke="#424242"/><text x="610" y="636">+1</text>
    <line x1="740" y1="618" x2="740" y2="624" stroke="#424242"/><text x="740" y="636">+4</text>
  </g>
  <text x="460" y="660" text-anchor="middle" font-size="12" fill="#424242">log2 Fold Change</text>

  <!-- Y axis ticks and labels -->
  <g font-size="10" fill="#424242" text-anchor="end">
    <line x1="80" y1="560" x2="74" y2="560" stroke="#424242"/><text x="71" y="564">5</text>
    <line x1="80" y1="460" x2="74" y2="460" stroke="#424242"/><text x="71" y="464">15</text>
    <line x1="80" y1="360" x2="74" y2="360" stroke="#424242"/><text x="71" y="364">25</text>
    <line x1="80" y1="260" x2="74" y2="260" stroke="#424242"/><text x="71" y="264">40</text>
    <line x1="80" y1="160" x2="74" y2="160" stroke="#424242"/><text x="71" y="164">55</text>
  </g>
  <text x="30" y="340" text-anchor="middle" font-size="12" fill="#424242" transform="rotate(-90 30 340)">-log10(padj)</text>

  <!-- Legend -->
  <rect x="650" y="75" width="180" height="80" fill="white" stroke="#E0E0E0" rx="4"/>
  <circle cx="668" cy="95" r="5" fill="#C62828" opacity="0.8"/>
  <text x="680" y="99" font-size="10" fill="#424242">Surexprimé (n=642)</text>
  <circle cx="668" cy="115" r="5" fill="#1565C0" opacity="0.8"/>
  <text x="680" y="119" font-size="10" fill="#424242">Sous-exprimé (n=419)</text>
  <circle cx="668" cy="135" r="5" fill="#BDBDBD" opacity="0.8"/>
  <text x="680" y="139" font-size="10" fill="#424242">Non significatif</text>
</svg>
