<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="700" fill="#FAFAFA"/>
  <!-- Panel background -->
  <rect x="80" y="60" width="760" height="560" fill="white" stroke="#E0E0E0" stroke-width="1" rx="4"/>

  <!-- Title -->
  <text x="460" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#212121">Volcano Plot — Analyse Différentielle DESeq2</text>
  <text x="460" y="58" text-anchor="middle" font-size="11" fill="#757575">Traité vs. Contrôle | seuils : |log2FC| &gt; 1, padj &lt; 0.05</text>

  <!-- Grid lines -->
  <g stroke="#F5F5F5" stroke-width="1">
    <line x1="80" y1="160" x2="840" y2="160"/>
    <line x1="80" y1="260" x2="840" y2="260"/>
    <line x1="80" y1="360" x2="840" y2="360"/>
    <line x1="80" y1="460" x2="840" y2="460"/>
    <line x1="80" y1="560" x2="840" y2="560"/>
    <line x1="180" y1="60" x2="180" y2="620"/>
    <line x1="300" y1="60" x2="300" y2="620"/>
    <line x1="460" y1="60" x2="460" y2="620"/>
    <line x1="620" y1="60" x2="620" y2="620"/>
    <line x1="740" y1="60" x2="740" y2="620"/>
  </g>

  <!-- Threshold lines -->
  <line x1="80" y1="288" x2="840" y2="288" stroke="#424242" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="310" y1="60" x2="310" y2="620" stroke="#424242" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="610" y1="60" x2="610" y2="620" stroke="#424242" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="846" y="292" font-size="9" fill="#424242">p=0.05</text>
  <text x="305" y="75" text-anchor="middle" font-size="9" fill="#424242">-1</text>
  <text x="615" y="75" text-anchor="middle" font-size="9" fill="#424242">+1</text>

  <!-- NS points (grey cloud) -->
  <g fill="#BDBDBD" opacity="0.55">
    <circle cx="430" cy="520" r="2.5"/><circle cx="450" cy="510" r="2.5"/><circle cx="420" cy="530" r="2.5"/>
    <circle cx="470" cy="518" r="2.5"/><circle cx="440" cy="540" r="2.5"/><circle cx="410" cy="508" r="2.5"/>
    <circle cx="460" cy="525" r="2.5"/><circle cx="480" cy="535" r="2.5"/><circle cx="400" cy="515" r="2.5"/>
    <circle cx="490" cy="512" r="2.5"/><circle cx="415" cy="545" r="2.5"/><circle cx="445" cy="502" r="2.5"/>
    <circle cx="435" cy="555" r="2.5"/><circle cx="465" cy="498" r="2.5"/><circle cx="425" cy="548" r="2.5"/>
    <circle cx="475" cy="558" r="2.5"/><circle cx="405" cy="495" r="2.5"/><circle cx="455" cy="562" r="2.5"/>
    <circle cx="395" cy="538" r="2.5"/><circle cx="485" cy="492" r="2.5"/><circle cx="350" cy="545" r="2.5"/>
    <circle cx="370" cy="530" r="2.5"/><circle cx="380" cy="518" r="2.5"/><circle cx="500" cy="540" r="2.5"/>
    <circle cx="515" cy="525" r="2.5"/><circle cx="530" cy="512" r="2.5"/><circle cx="340" cy="555" r="2.5"/>
    <circle cx="360" cy="560" r="2.5"/><circle cx="545" cy="530" r="2.5"/><circle cx="555" cy="515" r="2.5"/>
    <circle cx="325" cy="542" r="2.5"/><circle cx="335" cy="508" r="2.5"/><circle cx="565" cy="548" r="2.5"/>
    <circle cx="440" cy="468" r="2"/><circle cx="460" cy="472" r="2"/><circle cx="420" cy="476" r="2"/>
    <circle cx="480" cy="464" r="2"/><circle cx="400" cy="480" r="2"/><circle cx="450" cy="458" r="2"/>
  </g>

